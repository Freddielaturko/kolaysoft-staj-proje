# Render'in ucretsiz plani 15 dakika istek gelmezse backend'i uyutuyor ve ilk istekte
# uyanmasi bir dakika kadar suruyor. Bu is 10 dakikada bir health endpoint'ine istek atiyor.
name: Backend'i uyanik tut

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health endpoint'ine istek at
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 120 \
            https://kolaysoft-staj-proje.onrender.com/api/health

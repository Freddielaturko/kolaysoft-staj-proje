# Her push ve pull request'te backend ve frontend'in derlendigini kontrol ediyor.
# Render ve Vercel sadece main'den deploy ettigi icin bozuk bir kodu main'e almadan once burada yakaliyorum.
name: Derleme

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven ile derle
        run: mvn -B -q package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vite ile derle
        run: npx vite build

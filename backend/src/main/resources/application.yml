spring:
  application:
    name: proje-durum-sistemi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projedurum}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_SECRET_MIN_32_CHARS_LONG}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
